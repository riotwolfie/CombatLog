name: CombatLog
version: '2.3.7'
main: com.riotwolfie.combatlog.CombatLogPlugin
api-version: '1.21'
description: Modern CombatLog plugin for Paper and Spigot servers
authors: [ badambarfi ]
softdepend: [ BetterTeams ]

commands:
  combatlog:
    description: Main CombatLog command
    aliases: [ cl, combat, ct ]
    permission: combatlog.use
    usage: /<command> [status|reload|untag]

permissions:
  combatlog.use:
    description: Allows checking combat status
    default: true
  combatlog.bypass:
    description: Bypasses combat tag and punishment
    default: false
  combatlog.admin:
    description: Allows administrative commands like reload and untag
    default: op
